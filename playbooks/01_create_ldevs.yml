---
####################################################################
# Playbook 1: Create LDEVs on VSP One Block 28
# Creates 10 LDEVs of 10GB each for NVMe/TCP namespaces
####################################################################
- name: Create LDEVs on VSP One Block 28
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml
    - vars/storage_vars.yml

  vars:
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    ####################################################################
    # Task: Check existing LDEV state before creation
    ####################################################################
    - name: Check if LDEV already exists
      hitachivantara.vspone_block.vsp.hv_ldev_facts:
        connection_info: "{{ connection_info }}"
        spec:
          ldev_id: "{{ (ldev_start_id | int) + (item | int) }}"
      loop: "{{ range(0, ldev_count | int) | list }}"
      register: ldev_check

    ####################################################################
    # Task: Create LDEVs only if they are NOT DEFINED
    ####################################################################
    - name: Create LDEVs for NVMe/TCP namespaces
      hitachivantara.vspone_block.vsp.hv_ldev:
        connection_info: "{{ connection_info }}"
        state: present
        spec:
          ldev_id: "{{ (ldev_start_id | int) + (item | int) }}"
          pool_id: "{{ pool_id | int }}"
          size: "{{ ldev_size }}"
          capacity_saving: "disabled"
          name: "{{ ldev_name_prefix }}_{{ '%04d' | format((ldev_start_id | int) + (item | int)) }}"
      loop: "{{ range(0, ldev_count | int) | list }}"
      when: >
        ldev_check.results[item].ansible_facts.volumes[0].emulation_type == "NOT DEFINED"
      register: ldev_results

    - name: Display created LDEV details
      ansible.builtin.debug:
        msg: "LDEV {{ (ldev_start_id | int) + (item | int) }}: {{ 'created' if ldev_results.results[item].changed | default(false) else 'skipped (already defined)' }}"
      loop: "{{ range(0, ldev_count | int) | list }}"
