---
####################################################################
# Playbook 5: Add Software NVMe over TCP Adapter on ESXi Host
# Adds the NVMe/TCP software adapter on the ESXi host
####################################################################
- name: Add Software NVMe over TCP Adapter on ESXi Host
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_esxi_var.yml
    - vars/esxi_vars.yml

  tasks:
    ####################################################################
    # Task: Add Software NVMe over TCP Adapter
    # Uses esxcli via community.vmware.vmware_host_command to add adapter
    ####################################################################
    - name: Add Software NVMe over TCP Adapter via esxcli
      ansible.builtin.raw: "esxcli nvme fabrics enable --protocol TCP --device {{ vmnic_100g_1 }}"
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: nvme_adapter_result_1
      failed_when:
        - nvme_adapter_result_1.rc != 0
        - "'already enabled' not in nvme_adapter_result_1.stdout | default('')"
      changed_when: nvme_adapter_result_1.rc == 0

    - name: Display NVMe/TCP adapter result for vmnic_100g_1
      ansible.builtin.debug:
        var: nvme_adapter_result_1

    ####################################################################
    # Task: Add Software NVMe over TCP Adapter for vmnic_100g_2
    ####################################################################
    - name: Add Software NVMe over TCP Adapter via esxcli for vmnic_100g_2
      ansible.builtin.raw: "esxcli nvme fabrics enable --protocol TCP --device {{ vmnic_100g_2 }}"
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: nvme_adapter_result_2
      failed_when:
        - nvme_adapter_result_2.rc != 0
        - "'already enabled' not in nvme_adapter_result_2.stdout | default('')"
      changed_when: nvme_adapter_result_2.rc == 0

    - name: Display NVMe/TCP adapter result for vmnic_100g_2
      ansible.builtin.debug:
        var: nvme_adapter_result_2

    ####################################################################
    # Task: Verify NVMe/TCP adapters are added
    ####################################################################
    - name: Verify NVMe/TCP adapter status
      ansible.builtin.raw: "esxcli nvme adapter list"
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: nvme_adapter_list
      until: "nvme_adapter_list.stdout | default('') | regex_findall('(?i)TCP') | length >= 2"
      retries: 12
      delay: 5

    - name: Display NVMe adapter list
      ansible.builtin.debug:
        var: nvme_adapter_list.stdout_lines

    ####################################################################
    # Task: Parse and save newly created NVMe/TCP adapter names
    # Extracts vmhba names where transport type is TCP and writes them
    # to a generated vars file consumed by playbook 06.
    ####################################################################
    - name: Parse NVMe/TCP adapter names from adapter list
      ansible.builtin.set_fact:
        nvme_tcp_adapters: >-
          {{ nvme_adapter_list.stdout_lines
             | select('search', '\bTCP\b')
             | map('regex_replace', '^(\S+).*', '\1')
             | list }}

    - name: Fail if fewer than 2 NVMe/TCP adapters were found
      ansible.builtin.fail:
        msg: "Expected at least 2 TCP adapters but found {{ nvme_tcp_adapters | length }}: {{ nvme_tcp_adapters }}"
      when: nvme_tcp_adapters | length < 2

    - name: Display parsed NVMe/TCP adapter names
      ansible.builtin.debug:
        msg: "Found NVMe/TCP adapters: {{ nvme_tcp_adapters }}"

    - name: Save NVMe/TCP adapter names to generated vars file
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbook 05 - do not edit manually
          # Contains the vmhba adapter names created by 'esxcli nvme fabrics enable'
          nvme_tcp_adapter_1: "{{ nvme_tcp_adapters[0] }}"
          nvme_tcp_adapter_2: "{{ nvme_tcp_adapters[1] }}"
        dest: "{{ playbook_dir }}/vars/generated_nvme_adapters.yml"
