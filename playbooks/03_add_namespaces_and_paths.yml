---
####################################################################
# Playbook 3: Add Namespaces and Namespace Paths to NVM Subsystem
# Registers LDEVs as namespaces and sets host NQN paths
####################################################################
- name: Add Namespaces and Namespace Paths to NVM Subsystem
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml
    - vars/storage_vars.yml

  vars:
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    ####################################################################
    # Task: Add namespaces with paths to the NVM Subsystem
    # Each LDEV becomes a namespace with a path to the host NQN
    ####################################################################
    - name: Add namespaces and namespace paths to NVM Subsystem
      hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
        connection_info: "{{ connection_info }}"
        spec:
          state: "add_namespace"
          name: "{{ nvm_subsystem_name }}"
          namespaces:
            - ldev_id: "{{ ldev_start_id + item }}"
              nickname: "{{ ldev_name_prefix }}_ns_{{ '%04d' | format(ldev_start_id + item) }}"
              paths:
                - "{{ host_nqn }}"
      loop: "{{ range(0, ldev_count) | list }}"
      register: namespace_results

    - name: Display namespace creation results
      ansible.builtin.debug:
        msg: "Namespace for LDEV {{ ldev_start_id + item }} added successfully"
      loop: "{{ range(0, ldev_count) | list }}"
      when: namespace_results.results[item] is defined
