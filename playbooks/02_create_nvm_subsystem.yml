---
####################################################################
# Playbook 2: Create NVM Subsystem on VSP One Block 28
# Creates an NVM Subsystem with ports and host NQN registration
####################################################################
- name: Create NVM Subsystem on VSP One Block 28
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml
    - vars/storage_vars.yml

  vars:
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    ####################################################################
    # Task: Create NVM Subsystem with ports and host NQN
    ####################################################################
    - name: Create NVM Subsystem with ports and host NQN
      hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
        connection_info: "{{ connection_info }}"
        spec:
          name: "{{ nvm_subsystem_name }}"
          ports: "{{ storage_ports }}"
          host_mode: "{{ nvm_subsystem_host_mode }}"
          enable_namespace_security: true
          host_nqns:
            - nqn: "{{ host_nqn }}"
              nickname: "{{ host_nqn_nickname }}"
      register: nvm_subsystem_result

    - name: Display NVM Subsystem creation result
      ansible.builtin.debug:
        var: nvm_subsystem_result

    ####################################################################
    # Task: Retrieve and save the subsystem NQN for use by ESXi playbooks
    # This eliminates the need to manually copy the NQN into esxi_vars.yml
    ####################################################################
    - name: Query NVM Subsystem facts to retrieve NQN
      hitachivantara.vspone_block.vsp.hv_nvm_subsystems_facts:
        connection_info: "{{ connection_info }}"
        spec:
          name: "{{ nvm_subsystem_name }}"
      register: nvm_subsystem_facts

    - name: Save subsystem NQN to generated vars file
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbook 02_create_nvm_subsystem.yml - do not edit manually
          subsystem_nqn: "{{ nvm_subsystem_facts.data[0].nvm_subsystem_nqn }}"
        dest: "{{ playbook_dir }}/vars/generated_nvm_nqn.yml"
        mode: '0644'

    - name: Display discovered subsystem NQN
      ansible.builtin.debug:
        msg: "Subsystem NQN saved to vars/generated_nvm_nqn.yml: {{ nvm_subsystem_facts.data[0].nvm_subsystem_nqn }}"
