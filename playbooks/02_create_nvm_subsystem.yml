---
####################################################################
# Playbook 2: Create NVM Subsystem on VSP One Block 28
# Creates an NVM Subsystem with ports and host NQN registration
####################################################################
- name: Create NVM Subsystem on VSP One Block 28
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_storage_var.yml
    - vars/storage_vars.yml

  vars:
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  tasks:
    ####################################################################
    # Task: Create NVM Subsystem with ports and host NQN
    ####################################################################
    - name: Create NVM Subsystem with ports and host NQN
      hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
        connection_info: "{{ connection_info }}"
        spec:
          id: "{{ subsystem_id }}"
          name: "{{ nvm_subsystem_name }}"
          ports: "{{ storage_ports }}"
          host_mode: "{{ nvm_subsystem_host_mode }}"
          enable_namespace_security: true
          host_nqns:
            - nqn: "{{ host_nqn }}"
              nickname: "{{ host_nqn_nickname }}"
      register: nvm_subsystem_result

    - name: Display NVM Subsystem creation result
      ansible.builtin.debug:
        var: nvm_subsystem_result

    ####################################################################
    # Task: Construct and save the subsystem NQN for use by ESXi playbooks
    # NQN format: nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.<s[0]>-<s[1:]>-nvmssid.<id>
    ####################################################################
    - name: Set storage serial and subsystem ID from creation result
      ansible.builtin.set_fact:
        _serial: "{{ nvm_subsystem_result.nvm_subsystems[0].storage_serial_number }}"
        _nvmssid: "{{ '%05d' | format(nvm_subsystem_result.nvm_subsystems[0].nvm_subsystem_info.nvm_subsystem_id) }}"

    - name: Construct subsystem NQN
      ansible.builtin.set_fact:
        constructed_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.{{ _serial[0] }}-{{ _serial[1:] }}-nvmssid.{{ _nvmssid }}"

    - name: Save subsystem NQN to generated vars file
      ansible.builtin.copy:
        content: |
          ---
          # Auto-generated by playbook 02_create_nvm_subsystem.yml
          # Constructed from storage_serial_number and nvm_subsystem_id
          subsystem_nqn: "{{ constructed_nqn }}"
        dest: "{{ playbook_dir }}/vars/generated_nvm_nqn.yml"
        mode: '0644'

    - name: Display constructed subsystem NQN
      ansible.builtin.debug:
        msg: "Subsystem NQN saved to vars/generated_nvm_nqn.yml: {{ constructed_nqn }}"
