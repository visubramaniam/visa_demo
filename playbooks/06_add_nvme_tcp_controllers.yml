---
####################################################################
# Playbook 6: Add NVMe/TCP Target Controllers on ESXi Host
# Connects ESXi to VSP One Block 28 NVMe/TCP subsystem
# Adds one controller per storage port for multipath
####################################################################
- name: Add NVMe/TCP Target Controllers on ESXi Host
  hosts: localhost
  gather_facts: false

  vars_files:
    - ../ansible_vault_vars/ansible_vault_esxi_var.yml
    - vars/esxi_vars.yml

  tasks:
    ####################################################################
    # Task: Load auto-generated subsystem NQN from step 2
    # Falls back to subsystem_nqn in esxi_vars.yml if not found
    ####################################################################
    - name: Check if auto-generated NQN file exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/vars/generated_nvm_nqn.yml"
      register: generated_nqn_file

    - name: Load auto-generated subsystem NQN
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/generated_nvm_nqn.yml"
      when: generated_nqn_file.stat.exists

    - name: Display subsystem NQN being used
      ansible.builtin.debug:
        msg: "Using subsystem NQN: {{ subsystem_nqn }}"

    ####################################################################
    # Task: Add NVMe/TCP controller for Storage Port 1 (CL3-A)
    ####################################################################
    - name: Add NVMe/TCP controller for storage port 1
      ansible.builtin.raw: >-
        esxcli nvme fabrics connect
        --adapter vmhba64
        --ip-address {{ storage_port1_ip }}
        --port-number {{ nvme_tcp_port }}
        --subsystem-nqn {{ subsystem_nqn }}
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: controller1_result
      failed_when:
        - controller1_result.rc != 0
        - "'already connected' not in (controller1_result.stdout | default(''))"
      changed_when: controller1_result.rc == 0

    - name: Display controller 1 result
      ansible.builtin.debug:
        var: controller1_result

    ####################################################################
    # Task: Add NVMe/TCP controller for Storage Port 2 (CL4-A)
    ####################################################################
    - name: Add NVMe/TCP controller for storage port 2
      ansible.builtin.raw: >-
        esxcli nvme fabrics connect
        --adapter vmhba65
        --ip-address {{ storage_port2_ip }}
        --port-number {{ nvme_tcp_port }}
        --subsystem-nqn {{ subsystem_nqn }}
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: controller2_result
      failed_when:
        - controller2_result.rc != 0
        - "'already connected' not in (controller2_result.stdout | default(''))"
      changed_when: controller2_result.rc == 0

    - name: Display controller 2 result
      ansible.builtin.debug:
        var: controller2_result

    ####################################################################
    # Task: Verify NVMe/TCP controllers and namespaces
    ####################################################################
    - name: Verify NVMe/TCP controllers
      ansible.builtin.raw: "esxcli nvme controller list"
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: nvme_fabrics_list

    - name: Display connected NVMe/TCP controllers
      ansible.builtin.debug:
        var: nvme_fabrics_list.stdout_lines

    - name: Verify NVMe/TCP namespaces visible to ESXi
      ansible.builtin.raw: "esxcli nvme namespace list"
      delegate_to: "{{ esxi_hostname }}"
      vars:
        ansible_user: "{{ vault_esxi_username }}"
        ansible_password: "{{ vault_esxi_password }}"
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
      register: nvme_namespaces

    - name: Display NVMe/TCP namespaces
      ansible.builtin.debug:
        var: nvme_namespaces.stdout_lines
