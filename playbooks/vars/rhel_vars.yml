---
####################################################################
# RHEL host variables for NVMe/TCP networking setup
####################################################################

# RHEL host NIC interfaces (dual-port 100G NIC, e.g. Intel E810-CQDA2)
rhel_nic1: "ens2f0"
rhel_nic2: "ens2f1"

# NIC IP configuration - must be in same subnet as corresponding storage ports
# Subnet 1: RHEL NIC1 <-> Storage Port 1
rhel_nic1_ip: "192.168.10.45"
# Subnet 2: RHEL NIC2 <-> Storage Port 2
rhel_nic2_ip: "192.168.20.45"
rhel_nic_prefix: 24

# Storage port IPs for NVMe/TCP targets
storage_port1_ip: "192.168.10.30"
storage_port2_ip: "192.168.20.30"
nvme_tcp_port: 4420
nvme_discovery_port: 8009

# Host NQN - obtain from RHEL host with: cat /etc/nvme/hostnqn
host_nqn: "nqn.2014-08.org.nvmexpress:uuid:37333550-3035-4753-4833-333053573843"
host_nqn_nickname: "rhel_host_nqn"

# Subsystem NQN - auto-generated by step 2 into vars/generated_nvm_nqn.yml
# This value is used as a fallback if the generated file does not exist
subsystem_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.8-10008-nvmssid.00001"
