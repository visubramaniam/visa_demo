---
####################################################################
# Storage-side variables for VSP One Block 28 NVMe/TCP setup
####################################################################

# Pool ID for LDEV creation
pool_id: 0

# LDEV configuration - 10 LDEVs of 10GB each
ldev_start_id: 0
ldev_count: 10
ldev_size: "10GB"
ldev_name_prefix: "nvme_tcp_ldev"

# NVM Subsystem configuration
nvm_subsystem_name: "NVMeTCP_VSPOneB28"
nvm_subsystem_host_mode: "VMWARE_EX"

# 100G NVMe/TCP storage ports
storage_ports:
  - "CL3-A"
  - "CL4-A"

# ESXi Host NQN - obtain from ESXi host with: esxcli nvme info get
host_nqn: "nqn.2014-08.org.nvmexpress:uuid:664b5717-47ff-5601-3aee-b83fd22a0b10"
host_nqn_nickname: "esxi_host_nqn"
