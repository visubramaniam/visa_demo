---
####################################################################
# ESXi host variables for NVMe/TCP networking setup
####################################################################

# 100Gbps physical NIC names (Mellanox dual-port)
vmnic_100g_1: "vmnic6"
vmnic_100g_2: "vmnic7"

# vSwitch configuration - one vSwitch per NIC for NVMe/TCP port binding
vswitch1_name: "vSwitch_NVMe_TCP_1"
vswitch2_name: "vSwitch_NVMe_TCP_2"
vswitch_mtu: 9000

# VMkernel adapter configuration
# Subnet 1: ESXi vmk1 <-> Storage CL3-A (192.168.52.x)
vmk1_portgroup: "NVMe_TCP_PG1"
vmk1_ip: "172.28.55.194"
vmk1_subnet: "255.255.0.0"

# Subnet 2: ESXi vmk2 <-> Storage CL4-A (192.168.52.x)
vmk2_portgroup: "NVMe_TCP_PG2"
vmk2_ip: "172.29.55.194"
vmk2_subnet: "255.255.0.0"

# Storage port IPs for NVMe/TCP target controllers
storage_port1_ip: "172.28.55.196"
storage_port2_ip: "172.29.55.196"
nvme_tcp_port: 4420

# Subsystem NQN - auto-generated by step 2 (02_create_nvm_subsystem.yml) into
# vars/generated_nvm_nqn.yml, constructed from storage_serial_number and nvm_subsystem_id
# This value is used as a fallback if the generated file does not exist
# Format: nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.<s[0]>-<s[1:]>-nvmssid.<id>
subsystem_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.8-40498-nvmssid.00000"
