---
####################################################################
# Storage-side variables for VSP One Block 28 NVMe/TCP setup (RHEL)
####################################################################

# Pool ID for LDEV creation
rhel_pool_id: 0

# LDEV configuration - 10 LDEVs of 10GB each
rhel_ldev_start_id: 6144
rhel_ldev_count: 10
rhel_ldev_size: "10GB"
rhel_ldev_name_prefix: "rhel_nvme_tcp_ldev"

# NVM Subsystem configuration
rhel_subsystem_id: 1
rhel_nvm_subsystem_name: "NVMeTCP_RHEL_VSPOneB28"
rhel_nvm_subsystem_host_mode: "LINUX/IRIX"

# 100G NVMe/TCP storage ports
rhel_storage_ports:
  - "CL3-D"
  - "CL4-D"

# Storage port IPs for NVMe/TCP targets
rhel_storage_port1_ip: "192.168.10.30"
rhel_storage_port2_ip: "192.168.20.30"
rhel_nvme_tcp_port: 4420
rhel_nvme_discovery_port: 8009

# RHEL Host NQN nickname - the NQN itself is read from the host in Step 2
rhel_host_nqn_nickname: "rhel_host_nqn"

# Subsystem NQN - auto-generated by Step 3 into vars/generated_rhel_nvm_nqn.yml
# This value is used as a fallback if the generated file does not exist
rhel_subsystem_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.8-10008-nvmssid.00001"
