---
####################################################################
# Master Playbook: End-to-End NVMe/TCP Setup
# Executes all 6 steps in a single combined role:
#   Step 1 - Create LDEVs on VSP One Block 28
#   Step 2 - Create NVM Subsystem with ports and host NQN
#   Step 3 - Add namespaces and namespace paths
#   Step 4 - Configure ESXi networking (vSwitches + VMkernel adapters)
#   Step 5 - Add software NVMe over TCP adapter
#   Step 6 - Add NVMe/TCP target controllers
####################################################################

- name: "NVMe/TCP End-to-End Setup: VSP One Block 28 + ESXi"
  hosts: localhost
  gather_facts: false

  vars_files:
    - ansible_vault_vars/ansible_vault_storage_var.yml
    - ansible_vault_vars/ansible_vault_esxi_var.yml
    - playbooks/vars/storage_vars.yml
    - playbooks/vars/esxi_vars.yml

  vars:
    connection_info:
      address: "{{ storage_address }}"
      username: "{{ vault_storage_username }}"
      password: "{{ vault_storage_secret }}"

  roles:
    - role: roles/nvme_tcp_end_to_end
