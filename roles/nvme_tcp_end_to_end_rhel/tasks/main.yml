---
####################################################################
# Role: nvme_tcp_end_to_end_rhel
# Combined role for full NVMe/TCP setup for RHEL host:
#   Phase 1: VSP One Block 28 storage configuration
#     Step 1 - Create LDEVs
#     Step 2 - Create NVM Subsystem + auto-generate NQN
#     Step 3 - Add namespaces and paths
#   Phase 2: RHEL host configuration
#     Step 4 - Configure RHEL networking and install NVMe packages
#     Step 5 - NVMe/TCP target discovery and connect
#     Step 6 - Configure NVMe native multipathing
#
# Reference: "Configuring NVMe/TCP and Multipathing for RHEL and
#   SLES Linux OS with VSP One Block 20 Storage NVM Subsystems v1.0"
####################################################################

####################################################################
# Step 1: Create LDEVs on VSP One Block 28
####################################################################
- name: "Step 1 - Create LDEVs for NVMe/TCP namespaces"
  hitachivantara.vspone_block.vsp.hv_ldev:
    connection_info: "{{ connection_info }}"
    state: present
    spec:
      ldev_id: "{{ (rhel_ldev_start_id | int) + (item | int) }}"
      pool_id: "{{ rhel_pool_id | int }}"
      size: "{{ rhel_ldev_size }}"
      capacity_saving: "compression_deduplication"
      data_reduction_share: true
      name: "{{ rhel_ldev_name_prefix }}_{{ '%04d' | format((rhel_ldev_start_id | int) + (item | int)) }}"
  loop: "{{ range(0, rhel_ldev_count | int) | list }}"
  register: ldev_results

- name: "Step 1 - Display created LDEV details"
  ansible.builtin.debug:
    msg: "LDEV {{ rhel_ldev_start_id + item }} created successfully"
  loop: "{{ range(0, rhel_ldev_count) | list }}"
  when: ldev_results.results[item] is defined

####################################################################
# Step 2: Create NVM Subsystem with ports and host NQN
####################################################################
- name: "Step 2 - Create NVM Subsystem with ports and host NQN"
  hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
    connection_info: "{{ connection_info }}"
    spec:
      id: "{{ rhel_subsystem_id }}"
      name: "{{ rhel_nvm_subsystem_name }}"
      ports: "{{ rhel_storage_ports }}"
      host_mode: "{{ rhel_nvm_subsystem_host_mode }}"
      enable_namespace_security: true
      host_nqns:
        - nqn: "{{ rhel_host_nqn }}"
          nickname: "{{ rhel_host_nqn_nickname }}"
  register: nvm_subsystem_result

- name: "Step 2 - Display NVM Subsystem creation result"
  ansible.builtin.debug:
    var: nvm_subsystem_result

- name: "Step 2 - Set storage serial and subsystem ID from creation result"
  ansible.builtin.set_fact:
    _serial: "{{ nvm_subsystem_result.nvm_subsystems[0].storage_serial_number }}"
    _nvmssid: "{{ '%05d' | format(nvm_subsystem_result.nvm_subsystems[0].nvm_subsystem_info.nvm_subsystem_id) }}"

- name: "Step 2 - Construct subsystem NQN"
  ansible.builtin.set_fact:
    constructed_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.{{ _serial[0] }}-{{ _serial[1:] }}-nvmssid.{{ _nvmssid }}"

- name: "Step 2 - Save subsystem NQN to generated vars file"
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by role nvme_tcp_end_to_end_rhel (Step 2)
      # Constructed from storage_serial_number and nvm_subsystem_id
      rhel_subsystem_nqn: "{{ constructed_nqn }}"
    dest: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_rhel_nvm_nqn.yml"
    mode: '0644'

- name: "Step 2 - Display constructed subsystem NQN"
  ansible.builtin.debug:
    msg: "Subsystem NQN saved: {{ constructed_nqn }}"

####################################################################
# Step 3: Add namespaces and namespace paths to NVM Subsystem
####################################################################
- name: "Step 3 - Add namespaces and namespace paths to NVM Subsystem"
  hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
    connection_info: "{{ connection_info }}"
    spec:
      state: "add_namespace"
      name: "{{ rhel_nvm_subsystem_name }}"
      namespaces:
        - ldev_id: "{{ rhel_ldev_start_id + item }}"
          nickname: "{{ rhel_ldev_name_prefix }}_ns_{{ '%04d' | format(rhel_ldev_start_id + item) }}"
          paths:
            - "{{ rhel_host_nqn }}"
  loop: "{{ range(0, rhel_ldev_count) | list }}"
  register: namespace_results

- name: "Step 3 - Display namespace creation results"
  ansible.builtin.debug:
    msg: "Namespace for LDEV {{ rhel_ldev_start_id + item }} added successfully"
  loop: "{{ range(0, rhel_ldev_count) | list }}"
  when: namespace_results.results[item] is defined

####################################################################
# Step 4: Configure RHEL Networking and Install NVMe Packages
####################################################################
- name: "Step 4 - Verify nvme-cli is installed"
  ansible.builtin.shell: rpm -qa | grep nvme-cli
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_cli_check
  changed_when: false
  failed_when: false

- name: "Step 4 - Install nvme-cli if not present"
  ansible.builtin.yum:
    name: nvme-cli
    state: present
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  when: nvme_cli_check.rc != 0

- name: "Step 4 - Display installed nvme-cli package"
  ansible.builtin.debug:
    msg: "nvme-cli: {{ nvme_cli_check.stdout_lines | default(['not installed']) }}"

- name: "Step 4 - Read host NQN from RHEL host"
  ansible.builtin.command: cat /etc/nvme/hostnqn
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: rhel_host_nqn_result
  changed_when: false

- name: "Step 4 - Display RHEL host NQN"
  ansible.builtin.debug:
    msg: "RHEL Host NQN: {{ rhel_host_nqn_result.stdout }}"

- name: "Step 4 - Configure static IP on NIC interface 1 ({{ rhel_nic1 }})"
  ansible.builtin.shell: |
    nmcli con mod {{ rhel_nic1 }} ipv4.addresses {{ rhel_nic1_ip }}/{{ rhel_nic_prefix }} \
      ipv4.method manual
    nmcli con up {{ rhel_nic1 }}
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nic1_config
  changed_when: "'successfully activated' in nic1_config.stdout | default('')"

- name: "Step 4 - Configure static IP on NIC interface 2 ({{ rhel_nic2 }})"
  ansible.builtin.shell: |
    nmcli con mod {{ rhel_nic2 }} ipv4.addresses {{ rhel_nic2_ip }}/{{ rhel_nic_prefix }} \
      ipv4.method manual
    nmcli con up {{ rhel_nic2 }}
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nic2_config
  changed_when: "'successfully activated' in nic2_config.stdout | default('')"

- name: "Step 4 - Verify NIC interface IP addresses"
  ansible.builtin.command: ip addr show
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: ip_addr_output
  changed_when: false

- name: "Step 4 - Display NIC IP addresses"
  ansible.builtin.debug:
    var: ip_addr_output.stdout_lines

- name: "Step 4 - Verify connectivity to storage port 1"
  ansible.builtin.command: "ping -c 4 {{ rhel_storage_port1_ip }}"
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: ping_port1
  changed_when: false

- name: "Step 4 - Verify connectivity to storage port 2"
  ansible.builtin.command: "ping -c 4 {{ rhel_storage_port2_ip }}"
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: ping_port2
  changed_when: false

- name: "Step 4 - Display connectivity results"
  ansible.builtin.debug:
    msg:
      - "Ping to {{ rhel_storage_port1_ip }}: {{ 'SUCCESS' if ping_port1.rc == 0 else 'FAILED' }}"
      - "Ping to {{ rhel_storage_port2_ip }}: {{ 'SUCCESS' if ping_port2.rc == 0 else 'FAILED' }}"

####################################################################
# Step 5: NVMe/TCP Target Discovery and Connect
####################################################################
- name: "Step 5 - Load nvme_tcp kernel module"
  ansible.builtin.command: modprobe nvme_tcp
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: modprobe_result
  changed_when: modprobe_result.rc == 0

- name: "Step 5 - Verify nvme_tcp module is loaded"
  ansible.builtin.shell: lsmod | grep nvme_tcp
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: lsmod_result
  changed_when: false

- name: "Step 5 - Display nvme_tcp module status"
  ansible.builtin.debug:
    var: lsmod_result.stdout_lines

- name: "Step 5 - Check if auto-generated NQN file exists"
  ansible.builtin.stat:
    path: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_rhel_nvm_nqn.yml"
  register: generated_nqn_file

- name: "Step 5 - Load auto-generated subsystem NQN"
  ansible.builtin.include_vars:
    file: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_rhel_nvm_nqn.yml"
  when: generated_nqn_file.stat.exists

- name: "Step 5 - Display subsystem NQN being used"
  ansible.builtin.debug:
    msg: "Using subsystem NQN: {{ rhel_subsystem_nqn }}"

- name: "Step 5 - Discover NVMe targets via storage port 1"
  ansible.builtin.command: >-
    nvme discover
    --transport=tcp
    --traddr={{ rhel_storage_port1_ip }}
    --host-traddr={{ rhel_nic1_ip }}
    --trsvcid={{ rhel_nvme_discovery_port }}
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: discover_port1
  changed_when: false

- name: "Step 5 - Display discovery results for storage port 1"
  ansible.builtin.debug:
    var: discover_port1.stdout_lines

- name: "Step 5 - Discover NVMe targets via storage port 2"
  ansible.builtin.command: >-
    nvme discover
    --transport=tcp
    --traddr={{ rhel_storage_port2_ip }}
    --host-traddr={{ rhel_nic2_ip }}
    --trsvcid={{ rhel_nvme_discovery_port }}
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: discover_port2
  changed_when: false

- name: "Step 5 - Display discovery results for storage port 2"
  ansible.builtin.debug:
    var: discover_port2.stdout_lines

- name: "Step 5 - Configure /etc/nvme/discovery.conf with ctrl-loss-tmo=-1"
  ansible.builtin.copy:
    content: |
      # NVMe/TCP discovery configuration
      # Auto-generated by role nvme_tcp_end_to_end_rhel (Step 5)
      # ctrl-loss-tmo=-1 enables infinite reconnect on path failure
      --transport=tcp --traddr={{ rhel_storage_port1_ip }} --host-traddr={{ rhel_nic1_ip }} --trsvcid={{ rhel_nvme_discovery_port }} --ctrl-loss-tmo=-1
      --transport=tcp --traddr={{ rhel_storage_port2_ip }} --host-traddr={{ rhel_nic2_ip }} --trsvcid={{ rhel_nvme_discovery_port }} --ctrl-loss-tmo=-1
    dest: /etc/nvme/discovery.conf
    mode: '0644'
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: "Step 5 - Connect to all discovered NVMe controllers"
  ansible.builtin.command: nvme connect-all
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: connect_all_result
  changed_when: true

- name: "Step 5 - Display connect-all result"
  ansible.builtin.debug:
    var: connect_all_result

- name: "Step 5 - Enable and start nvmf-autoconnect service"
  ansible.builtin.systemd:
    name: nvmf-autoconnect
    enabled: true
    state: started
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: "Step 5 - List connected NVMe namespaces"
  ansible.builtin.command: nvme list
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_list_result
  changed_when: false

- name: "Step 5 - Display NVMe namespaces"
  ansible.builtin.debug:
    var: nvme_list_result.stdout_lines

- name: "Step 5 - List NVMe subsystem paths"
  ansible.builtin.command: nvme list-subsys
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_subsys_result
  changed_when: false

- name: "Step 5 - Display NVMe subsystem paths"
  ansible.builtin.debug:
    var: nvme_subsys_result.stdout_lines

####################################################################
# Step 6: Configure NVMe Native Multipathing on RHEL
####################################################################
- name: "Step 6 - Check current NVMe native multipath status"
  ansible.builtin.command: cat /sys/module/nvme_core/parameters/multipath
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: multipath_status
  changed_when: false

- name: "Step 6 - Display current multipath status"
  ansible.builtin.debug:
    msg: "NVMe native multipath enabled: {{ multipath_status.stdout | trim }}"

- name: "Step 6 - Enable NVMe native multipath via grubby (if not already enabled)"
  ansible.builtin.shell: |
    KERNEL=$(uname -r)
    grubby --args=nvme_core.multipath=Y --update-kernel /boot/vmlinuz-${KERNEL}
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  when: multipath_status.stdout | trim != 'Y'
  register: grubby_result

- name: "Step 6 - Disable DM multipath (not needed with NVMe native multipath)"
  ansible.builtin.systemd:
    name: multipathd
    enabled: false
    state: stopped
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  failed_when: false

- name: "Step 6 - Remove /etc/multipath.conf if present"
  ansible.builtin.file:
    path: /etc/multipath.conf
    state: absent
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: "Step 6 - Flush DM multipath maps"
  ansible.builtin.command: multipath -F
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  failed_when: false
  changed_when: false

- name: "Step 6 - Create udev rule for Hitachi SVOS round-robin IO policy"
  ansible.builtin.copy:
    content: |
      # Enable round-robin for Hitachi SVOS NVMe native multipath
      # Auto-generated by role nvme_tcp_end_to_end_rhel (Step 6)
      ACTION=="add", SUBSYSTEM=="nvme-subsystem", ATTR{model}=="HITACHI SVOS-RF-System", ATTR{iopolicy}="round-robin"
    dest: /lib/udev/rules.d/71-nvme-iopolicy-hitachi-SVOS.rules
    mode: '0644'
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

- name: "Step 6 - Regenerate initramfs"
  ansible.builtin.command: dracut -f -v
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  when: multipath_status.stdout | trim != 'Y'
  register: dracut_result

- name: "Step 6 - Display dracut result"
  ansible.builtin.debug:
    var: dracut_result
  when: dracut_result is defined and dracut_result is not skipped

- name: "Step 6 - NOTICE - Reboot required if multipath was just enabled"
  ansible.builtin.debug:
    msg: >-
      NVMe native multipath was enabled via grubby and initramfs was regenerated.
      A REBOOT of {{ rhel_hostname }} is required to activate multipathing.
      After reboot, verify with: cat /sys/module/nvme_core/parameters/multipath
      And verify IO policy with: cat /sys/class/nvme-subsystem/nvme-subsys*/iopolicy
  when: multipath_status.stdout | trim != 'Y'

- name: "Step 6 - Verify NVMe native multipath (if already enabled)"
  ansible.builtin.debug:
    msg: "NVMe native multipath is already enabled. No reboot required."
  when: multipath_status.stdout | trim == 'Y'

- name: "Step 6 - Verify IO policy for NVMe subsystems (if multipath already active)"
  ansible.builtin.shell: cat /sys/class/nvme-subsystem/nvme-subsys*/iopolicy
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: iopolicy_result
  changed_when: false
  failed_when: false
  when: multipath_status.stdout | trim == 'Y'

- name: "Step 6 - Display IO policy"
  ansible.builtin.debug:
    var: iopolicy_result.stdout_lines
  when: iopolicy_result is defined and iopolicy_result is not skipped

- name: "Step 6 - Final NVMe namespace and subsystem verification"
  ansible.builtin.command: nvme list
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: final_nvme_list
  changed_when: false
  when: multipath_status.stdout | trim == 'Y'

- name: "Step 6 - Display final NVMe namespace list"
  ansible.builtin.debug:
    var: final_nvme_list.stdout_lines
  when: final_nvme_list is defined and final_nvme_list is not skipped

- name: "Step 6 - Final NVMe subsystem path verification"
  ansible.builtin.command: nvme list-subsys
  delegate_to: "{{ rhel_hostname }}"
  vars:
    ansible_user: "{{ vault_rhel_username }}"
    ansible_password: "{{ vault_rhel_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: final_subsys_result
  changed_when: false
  when: multipath_status.stdout | trim == 'Y'

- name: "Step 6 - Display final subsystem paths (multipath verification)"
  ansible.builtin.debug:
    var: final_subsys_result.stdout_lines
  when: final_subsys_result is defined and final_subsys_result is not skipped
