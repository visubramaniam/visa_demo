---
####################################################################
# Role: nvme_tcp_end_to_end
# Combined role for full NVMe/TCP setup:
#   Phase 1: VSP One Block 28 storage configuration
#     Step 1 - Create LDEVs
#     Step 2 - Create NVM Subsystem + auto-generate NQN
#     Step 3 - Add namespaces and paths
#   Phase 2: ESXi host configuration
#     Step 4 - Configure networking (vSwitches, portgroups, VMkernel)
#     Step 5 - Add NVMe/TCP software adapters
#     Step 6 - Add NVMe/TCP target controllers
####################################################################

####################################################################
# Step 1: Create LDEVs on VSP One Block 28
####################################################################
- name: "Step 1 - Check existing LDEV state"
  hitachivantara.vspone_block.vsp.hv_ldev_facts:
    connection_info: "{{ connection_info }}"
    spec:
      ldev_id: "{{ (ldev_start_id | int) + (item | int) }}"
  loop: "{{ range(0, ldev_count | int) | list }}"
  register: ldev_check

- name: "Step 1 - Create LDEVs for NVMe/TCP namespaces"
  hitachivantara.vspone_block.vsp.hv_ldev:
    connection_info: "{{ connection_info }}"
    state: present
    spec:
      ldev_id: "{{ (ldev_start_id | int) + (item | int) }}"
      pool_id: "{{ pool_id | int }}"
      size: "{{ ldev_size }}"
      capacity_saving: "compression_deduplication"
      data_reduction_share: true
      name: "{{ ldev_name_prefix }}_{{ '%04d' | format((ldev_start_id | int) + (item | int)) }}"
  loop: "{{ range(0, ldev_count | int) | list }}"
  when: >-
    ldev_check.results[item].ansible_facts.volumes[0].emulation_type == "NOT DEFINED"
  register: ldev_results

- name: "Step 1 - Display created LDEV details"
  ansible.builtin.debug:
    msg: "LDEV {{ (ldev_start_id | int) + (item | int) }}: {{ 'created' if ldev_results.results[item].changed | default(false) else 'skipped (already defined)' }}"
  loop: "{{ range(0, ldev_count | int) | list }}"

####################################################################
# Step 2: Create NVM Subsystem with ports and host NQN
####################################################################
- name: "Step 2 - Create NVM Subsystem with ports and host NQN"
  hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
    connection_info: "{{ connection_info }}"
    spec:
      id: "{{ subsystem_id }}"
      name: "{{ nvm_subsystem_name }}"
      ports: "{{ storage_ports }}"
      host_mode: "{{ nvm_subsystem_host_mode }}"
      enable_namespace_security: true
      host_nqns:
        - nqn: "{{ host_nqn }}"
          nickname: "{{ host_nqn_nickname }}"
  register: nvm_subsystem_result

- name: "Step 2 - Display NVM Subsystem creation result"
  ansible.builtin.debug:
    var: nvm_subsystem_result

- name: "Step 2 - Set storage serial and subsystem ID from creation result"
  ansible.builtin.set_fact:
    _serial: "{{ nvm_subsystem_result.nvm_subsystems[0].storage_serial_number }}"
    _nvmssid: "{{ '%05d' | format(nvm_subsystem_result.nvm_subsystems[0].nvm_subsystem_info.nvm_subsystem_id) }}"

- name: "Step 2 - Construct subsystem NQN"
  ansible.builtin.set_fact:
    constructed_nqn: "nqn.1994-04.jp.co.hitachi:nvme:storage-subsystem-sn.{{ _serial[0] }}-{{ _serial[1:] }}-nvmssid.{{ _nvmssid }}"

- name: "Step 2 - Save subsystem NQN to generated vars file"
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by role nvme_tcp_end_to_end (Step 2)
      # Constructed from storage_serial_number and nvm_subsystem_id
      subsystem_nqn: "{{ constructed_nqn }}"
    dest: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_nvm_nqn.yml"
    mode: '0644'

- name: "Step 2 - Display constructed subsystem NQN"
  ansible.builtin.debug:
    msg: "Subsystem NQN saved: {{ constructed_nqn }}"

####################################################################
# Step 3: Add namespaces and namespace paths to NVM Subsystem
####################################################################
- name: "Step 3 - Add namespaces and namespace paths to NVM Subsystem"
  hitachivantara.vspone_block.vsp.hv_nvm_subsystems:
    connection_info: "{{ connection_info }}"
    spec:
      state: "add_namespace"
      name: "{{ nvm_subsystem_name }}"
      namespaces:
        - ldev_id: "{{ ldev_start_id + item }}"
          nickname: "{{ ldev_name_prefix }}_ns_{{ '%04d' | format(ldev_start_id + item) }}"
          paths:
            - "{{ host_nqn }}"
  loop: "{{ range(0, ldev_count) | list }}"
  register: namespace_results

- name: "Step 3 - Display namespace creation results"
  ansible.builtin.debug:
    msg: "Namespace for LDEV {{ ldev_start_id + item }} added successfully"
  loop: "{{ range(0, ldev_count) | list }}"
  when: namespace_results.results[item] is defined

####################################################################
# Step 4: Configure ESXi Networking for NVMe/TCP
####################################################################
- name: "Step 4 - Create vSwitch1 for NVMe/TCP (first 100G NIC)"
  community.vmware.vmware_vswitch:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ esxi_hostname }}"
    switch: "{{ vswitch1_name }}"
    nics:
      - "{{ vmnic_100g_1 }}"
    mtu: "{{ vswitch_mtu }}"
    state: present

- name: "Step 4 - Create vSwitch2 for NVMe/TCP (second 100G NIC)"
  community.vmware.vmware_vswitch:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ esxi_hostname }}"
    switch: "{{ vswitch2_name }}"
    nics:
      - "{{ vmnic_100g_2 }}"
    mtu: "{{ vswitch_mtu }}"
    state: present

- name: "Step 4 - Create portgroup on vSwitch1 for NVMe/TCP"
  community.vmware.vmware_portgroup:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    hosts:
      - "{{ esxi_hostname }}"
    switch: "{{ vswitch1_name }}"
    portgroup: "{{ vmk1_portgroup }}"
    vlan_id: 0
    state: present

- name: "Step 4 - Create portgroup on vSwitch2 for NVMe/TCP"
  community.vmware.vmware_portgroup:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    hosts:
      - "{{ esxi_hostname }}"
    switch: "{{ vswitch2_name }}"
    portgroup: "{{ vmk2_portgroup }}"
    vlan_id: 0
    state: present

- name: "Step 4 - Create VMkernel adapter 1 on vSwitch1"
  community.vmware.vmware_vmkernel:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ esxi_hostname }}"
    vswitch_name: "{{ vswitch1_name }}"
    portgroup_name: "{{ vmk1_portgroup }}"
    mtu: "{{ vswitch_mtu }}"
    network:
      type: static
      ip_address: "{{ vmk1_ip }}"
      subnet_mask: "{{ vmk1_subnet }}"
    enable_ft: false
    enable_mgmt: false
    enable_vmotion: false
    enable_vsan: false
    state: present

- name: "Step 4 - Create VMkernel adapter 2 on vSwitch2"
  community.vmware.vmware_vmkernel:
    hostname: "{{ esxi_hostname }}"
    username: "{{ vault_esxi_username }}"
    password: "{{ vault_esxi_password }}"
    validate_certs: false
    esxi_hostname: "{{ esxi_hostname }}"
    vswitch_name: "{{ vswitch2_name }}"
    portgroup_name: "{{ vmk2_portgroup }}"
    mtu: "{{ vswitch_mtu }}"
    network:
      type: static
      ip_address: "{{ vmk2_ip }}"
      subnet_mask: "{{ vmk2_subnet }}"
    enable_ft: false
    enable_mgmt: false
    enable_vmotion: false
    enable_vsan: false
    state: present

- name: "Step 4 - Tag VMkernel adapter 1 for NVMe/TCP traffic"
  ansible.builtin.raw: "esxcli network ip interface tag add -i vmk1 -t NVMeTCP"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: vmk1_tag_result
  failed_when:
    - vmk1_tag_result.rc != 0
    - "'already tagged' not in vmk1_tag_result.stdout | default('')"
  changed_when: vmk1_tag_result.rc == 0

- name: "Step 4 - Tag VMkernel adapter 2 for NVMe/TCP traffic"
  ansible.builtin.raw: "esxcli network ip interface tag add -i vmk2 -t NVMeTCP"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: vmk2_tag_result
  failed_when:
    - vmk2_tag_result.rc != 0
    - "'already tagged' not in vmk2_tag_result.stdout | default('')"
  changed_when: vmk2_tag_result.rc == 0

####################################################################
# Step 5: Add NVMe/TCP software adapters on both 100G NICs
####################################################################
- name: "Step 5 - Add NVMe/TCP adapter for vmnic_100g_1"
  ansible.builtin.raw: "esxcli nvme fabrics enable --protocol TCP --device {{ vmnic_100g_1 }}"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_adapter_result_1
  failed_when:
    - nvme_adapter_result_1.rc != 0
    - "'already enabled' not in nvme_adapter_result_1.stdout | default('')"
  changed_when: nvme_adapter_result_1.rc == 0

- name: "Step 5 - Display NVMe/TCP adapter result for vmnic_100g_1"
  ansible.builtin.debug:
    var: nvme_adapter_result_1

- name: "Step 5 - Add NVMe/TCP adapter for vmnic_100g_2"
  ansible.builtin.raw: "esxcli nvme fabrics enable --protocol TCP --device {{ vmnic_100g_2 }}"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_adapter_result_2
  failed_when:
    - nvme_adapter_result_2.rc != 0
    - "'already enabled' not in nvme_adapter_result_2.stdout | default('')"
  changed_when: nvme_adapter_result_2.rc == 0

- name: "Step 5 - Display NVMe/TCP adapter result for vmnic_100g_2"
  ansible.builtin.debug:
    var: nvme_adapter_result_2

- name: "Step 5 - Verify NVMe/TCP adapter status"
  ansible.builtin.raw: "esxcli nvme adapter list"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_adapter_list

- name: "Step 5 - Display NVMe adapter list"
  ansible.builtin.debug:
    var: nvme_adapter_list.stdout_lines

- name: "Step 5 - Parse NVMe/TCP adapter names from adapter list"
  ansible.builtin.set_fact:
    nvme_tcp_adapters: >-
      {{ ((nvme_adapter_list.stdout | default('')) ~ '\n' ~ (nvme_adapter_list.stderr | default(''))).splitlines()
         | select('search', '^vmhba\d+\s+.*\s+TCP\s+')
         | map('regex_replace', '^(vmhba\d+)\s+.*$', '\1')
         | list }}

- name: "Step 5 - Fail if fewer than 2 NVMe/TCP adapters were found"
  ansible.builtin.fail:
    msg: "Expected at least 2 NVMe/TCP adapters but found {{ nvme_tcp_adapters | length }}: {{ nvme_tcp_adapters }}"
  when: nvme_tcp_adapters | length < 2

- name: "Step 5 - Display parsed NVMe/TCP adapter names"
  ansible.builtin.debug:
    msg: "Found NVMe/TCP adapters: adapter_1={{ nvme_tcp_adapters[0] }}, adapter_2={{ nvme_tcp_adapters[1] }}"

####################################################################
# Step 6: Add NVMe/TCP target controllers for multipath
####################################################################
- name: "Step 6 - Check if auto-generated NQN file exists"
  ansible.builtin.stat:
    path: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_nvm_nqn.yml"
  register: generated_nqn_file

- name: "Step 6 - Load auto-generated subsystem NQN"
  ansible.builtin.include_vars:
    file: "{{ role_path | dirname | dirname }}/playbooks/vars/generated_nvm_nqn.yml"
  when: generated_nqn_file.stat.exists

- name: "Step 6 - Display subsystem NQN being used"
  ansible.builtin.debug:
    msg: "Using subsystem NQN: {{ subsystem_nqn }}"

- name: "Step 6 - Add NVMe/TCP controller for storage port 1"
  ansible.builtin.raw: >-
    esxcli nvme fabrics connect
    --adapter {{ nvme_tcp_adapters[0] }}
    --ip-address {{ storage_port1_ip }}
    --port-number {{ nvme_tcp_port }}
    --subsystem-nqn {{ subsystem_nqn }}
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: controller1_result
  failed_when:
    - controller1_result.rc != 0
    - "'already connected' not in (controller1_result.stdout | default(''))"
  changed_when: controller1_result.rc == 0

- name: "Step 6 - Display controller 1 result"
  ansible.builtin.debug:
    var: controller1_result

- name: "Step 6 - Add NVMe/TCP controller for storage port 2"
  ansible.builtin.raw: >-
    esxcli nvme fabrics connect
    --adapter {{ nvme_tcp_adapters[1] }}
    --ip-address {{ storage_port2_ip }}
    --port-number {{ nvme_tcp_port }}
    --subsystem-nqn {{ subsystem_nqn }}
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: controller2_result
  failed_when:
    - controller2_result.rc != 0
    - "'already connected' not in (controller2_result.stdout | default(''))"
  changed_when: controller2_result.rc == 0

- name: "Step 6 - Display controller 2 result"
  ansible.builtin.debug:
    var: controller2_result

- name: "Step 6 - Verify NVMe/TCP controllers"
  ansible.builtin.raw: "esxcli nvme controller list"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_fabrics_list

- name: "Step 6 - Display connected NVMe/TCP controllers"
  ansible.builtin.debug:
    var: nvme_fabrics_list.stdout_lines

- name: "Step 6 - Verify NVMe/TCP namespaces visible to ESXi"
  ansible.builtin.raw: "esxcli nvme namespace list"
  delegate_to: "{{ esxi_hostname }}"
  vars:
    ansible_user: "{{ vault_esxi_username }}"
    ansible_password: "{{ vault_esxi_password }}"
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
  register: nvme_namespaces

- name: "Step 6 - Display NVMe/TCP namespaces"
  ansible.builtin.debug:
    var: nvme_namespaces.stdout_lines
